<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>System Login - Muheed  Enterprises</title>

    <meta
        name="description"
        content="Muheed  Enterprises Steel Inventory and Sales Management System"
    >


    <!-- Favicon -->

    <link
        rel="shortcut icon"
        href="images/k.ico"
        type="image/x-icon"
    >

    <link
        rel="icon"
        href="images/k.ico"
        type="image/x-icon"
    >


    <!-- Bootstrap -->

    <link
        rel="stylesheet"
        href="css/bootstrap/bootstrap.min.css"
    >


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Remix Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css"
        rel="stylesheet"
    >


    <!-- Lenis -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/lenis@1.3.23/dist/lenis.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/media.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <main id="login-page">


        <!-- =====================================================
             LEFT
        ====================================================== -->

        <div class="login-visual">

            <div class="login-visual-overlay"></div>


            <div class="login-visual-content">

                <a
                    href="index.html"
                    class="login-logo"
                >

                    Muheed 
                    <span>
                        ENTERPRISES
                    </span>

                </a>


                <div class="login-visual-bottom">

                    <span class="login-eyebrow">
                        STEEL MANAGEMENT SYSTEM
                    </span>

                    <h1>
                        Manage your
                        <span>business better.</span>
                    </h1>

                    <p>
                        Inventory, purchases, sales, orders and
                        dispatch — all in one simple workspace.
                    </p>

                </div>

            </div>

        </div>


        <!-- =====================================================
             RIGHT
        ====================================================== -->

        <div class="login-panel">

            <div class="login-box">


                <div class="login-heading">

                    <span>
                        SYSTEM LOGIN
                    </span>

                    <h2>
                        Welcome back.
                    </h2>

                    <p>
                        Sign in to access your management dashboard.
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form id="login-form">


                    <!-- Email -->

                    <div class="login-form-group">

                        <label for="login-email">
                            EMAIL / USERNAME
                        </label>

                        <div class="login-input">

                            <i class="ri-user-line"></i>

                            <input
                                type="text"
                                id="login-email"
                                name="email"
                                placeholder="Enter your email or username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="login-form-group">

                        <div class="login-label-row">

                            <label for="login-password">
                                PASSWORD
                            </label>

                            <a href="#">
                                Forgot password?
                            </a>

                        </div>


                        <div class="login-input">

                            <i class="ri-lock-line"></i>

                            <input
                                type="password"
                                id="login-password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="password-toggle"
                                aria-label="Show password"
                            >

                                <i class="ri-eye-line"></i>

                            </button>

                        </div>

                    </div>


                    <!-- Remember -->

                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                name="remember"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>

                    </div>


                    <!-- Error -->

                    <div
                        class="login-error"
                        id="login-error"
                    >
                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="login-submit"
                    >

                        <span>
                            Login to Dashboard
                        </span>

                        <i class="ri-arrow-right-line"></i>

                    </button>


                </form>


                <!-- Register -->

                <div class="login-register">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="register.html">
                        Register
                    </a>

                </div>


                <!-- Back -->

                <a
                    href="index.html"
                    class="back-home"
                >

                    <i class="ri-arrow-left-line"></i>

                    Back to website

                </a>

            </div>

        </div>

    </main>


    <!-- jQuery -->

    <script
        src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js">
    </script>


    <!-- Bootstrap -->

    <script
        src="js/bootstrap/bootstrap.bundle.min.js">
    </script>


    <!-- Lenis -->

    <script
        src="https://unpkg.com/lenis@1.3.23/dist/lenis.min.js">
    </script>


    <!-- GSAP -->

    <script src="js/gsap/gsap.min.js"></script>


    <!-- Custom -->

    <script src="js/login.js"></script>

</body>

</html>
